---
- name: Define dependency table
  ansible.builtin.set_fact:
    _deps: >-
      {{ _dependency_overrides | default({
        'rhoai': ['cert_manager', 'servicemesh', 'rhcl', 'kueue', 'jobset', 'leaderworkerset', 'nfd', 'gpu_operator'],
        'llm_serving': ['rhoai'],
        'maas_resources': ['rhoai', 'llm_serving'],
        'ogx': ['rhoai', 'odf'],
        'mlflow': ['rhoai', 'odf'],
        'guardrails': ['llm_serving'],
        'observability': ['rhoai'],
        'keycloak': ['lvm'],
      }) }}

- name: Check and auto-enable dependencies for rhoai
  ansible.builtin.include_tasks: _resolve_one.yml
  loop: "{{ _deps['rhoai'] | default([]) }}"
  loop_control:
    loop_var: _dep
  vars:
    _parent: rhoai
  when: install_rhoai | default(true)

- name: Check and auto-enable dependencies for llm_serving
  ansible.builtin.include_tasks: _resolve_one.yml
