---
- name: "Wait for CRD {{ crd_name }}"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ crd_name }}"
  register: _crd
  until: >-
    _crd is not failed and
    (_crd.resources | default([])) | length > 0
  retries: 30
  delay: 10
