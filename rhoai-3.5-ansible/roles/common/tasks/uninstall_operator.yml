---
# Shared task: uninstall an OLM Operator (Subscription + CSV + namespace)
# Required vars: operator_name, operator_namespace
# Optional vars: delete_namespace (default: true)

- name: "Delete Subscription {{ operator_name }}"
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: "{{ operator_name }}"
    namespace: "{{ operator_namespace }}"
  failed_when: false

- name: "Delete CSVs for {{ operator_name }}"
  ansible.builtin.shell: >-
    oc delete csv -n {{ operator_namespace }}
    -l operators.coreos.com/{{ operator_name }}.{{ operator_namespace }}=
    --wait=false 2>/dev/null || true
  changed_when: true
  failed_when: false

- name: "Delete namespace {{ operator_namespace }}"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ operator_namespace }}"
  failed_when: false
  when: delete_namespace | default(true)

- name: "Wait for namespace {{ operator_namespace }} deletion"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ operator_namespace }}"
  register: _ns
  until: >-
    _ns is not failed and
    (_ns.resources | default([])) | length == 0
  retries: 30
  delay: 10
  failed_when: false
  when: delete_namespace | default(true)
