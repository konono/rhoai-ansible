# COO「Accelerators common metrics」ダッシュボードが参照する recording rule
# GPU Operator が OpenShift 向けに自動作成しない場合の補完
# upstream: NVIDIA/gpu-operator assets/state-dcgm-exporter/1000_prometheus_rule_openshift.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nvidia-dcgm-exporter
  namespace: nvidia-gpu-operator
  labels:
    app: nvidia-dcgm-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  groups:
    - name: dcgm.accelerator.metrics
      interval: 30s
      rules:
        - record: accelerator_gpu_utilization
          expr: DCGM_FI_DEV_GPU_UTIL
          labels:
            vendor: nvidia
        - record: accelerator_memory_used_bytes
          expr: DCGM_FI_DEV_FB_USED * 1024 * 1024
          labels:
            vendor: nvidia
        - record: accelerator_memory_total_bytes
          expr: (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) * 1024 * 1024
          labels:
            vendor: nvidia
        - record: accelerator_power_usage_watts
          expr: DCGM_FI_DEV_POWER_USAGE
          labels:
            vendor: nvidia
        - record: accelerator_temperature_celsius
          expr: DCGM_FI_DEV_GPU_TEMP
          labels:
            vendor: nvidia
        - record: accelerator_sm_clock_hertz
          expr: DCGM_FI_DEV_SM_CLOCK * 1000000
          labels:
            vendor: nvidia
        - record: accelerator_memory_clock_hertz
          expr: DCGM_FI_DEV_MEM_CLOCK * 1000000
          labels:
            vendor: nvidia
---
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  daemonsets:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  operator:
    defaultRuntime: crio
    use_ocp_driver_toolkit: true
  driver:
    enabled: true
  toolkit:
    enabled: true
  devicePlugin:
    enabled: true
    config:
      name: ""
      default: ""
  dcgm:
    enabled: true
  dcgmExporter:
    enabled: true
    # Prometheus Operator ServiceMonitor (公式: GPU Operator / OpenShift monitoring)
    # https://docs.nvidia.com/datacenter/cloud-native/openshift/latest/install-gpu-ocp.html#cluster-monitoring
    serviceMonitor:
      enabled: true
      interval: 15s
      honorLabels: true
  gfd:
    enabled: true
  migManager:
    enabled: true
  nodeStatusExporter:
    enabled: true
  sandboxDevicePlugin:
    enabled: false
  validator:
    plugin:
      env:
        - name: WITH_WORKLOAD
          value: "false"

