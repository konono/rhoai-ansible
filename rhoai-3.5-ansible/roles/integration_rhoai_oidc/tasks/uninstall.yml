---
# Uninstall: integration_rhoai_oidc

- block:
    - name: Delete maas-oidc-client-secret from gateway namespace
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: maas-oidc-client-secret
        namespace: redhat-ai-gateway-infra
      failed_when: false

  rescue:
    - ansible.builtin.fail:
        msg: |
          Keycloak → AITenant OIDC のアンインストールに失敗しました。
          再実行: uv run ansible-playbook playbooks/uninstall.yml -i inventory/<env> --tags integration,rhoai_oidc
