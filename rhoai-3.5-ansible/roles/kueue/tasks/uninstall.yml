---
# Uninstall: kueue
# Ref: https://docs.redhat.com/en/documentation/openshift_container_platform/4.20/html/ai_workloads/red-hat-build-of-kueue
# Known issue: CRs may get stuck with "Resource is being deleted" — workaround is finalizer removal
# Order: Kueue CRs → Operator + namespace

- block:
    - name: Delete all Kueue CRs
      ansible.builtin.shell: >-
        oc delete clusterqueues,localqueues,resourceflavors,workloads
        --all --all-namespaces --wait=false 2>/dev/null || true
      changed_when: true
      failed_when: false

    - name: Wait for Kueue CRs deletion
      ansible.builtin.shell: >-
        oc get clusterqueues,localqueues,resourceflavors --all-namespaces --no-headers 2>/dev/null | wc -l
      register: _kueue_count
      until: _kueue_count.stdout | trim | int == 0
      retries: 12
      delay: 10
      changed_when: false
      failed_when: false

    - name: Remove stuck finalizers from Kueue CRs
      ansible.builtin.shell: |
        for kind in clusterqueues localqueues resourceflavors workloads; do
          for resource in $(oc get $kind --all-namespaces -o jsonpath='{range .items[*]}{.metadata.name}{" -n "}{.metadata.namespace}{"\n"}{end}' 2>/dev/null); do
            oc patch $kind $resource --type=merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
          done
        done
      changed_when: true
      failed_when: false
      when: _kueue_count.stdout | trim | int > 0

    - name: Uninstall Kueue Operator
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/uninstall_operator.yml"
      vars:
        operator_name: kueue-operator
        operator_namespace: openshift-kueue

  rescue:
    - ansible.builtin.fail:
        msg: |
          Kueue のアンインストールに失敗しました。
          再実行: ansible-playbook playbooks/uninstall.yml -i inventory/<env> --tags deps,kueue -e uninstall_kueue=true
