---
# Uninstall: maas_resources

- block:
    - name: Delete Dashboard RBAC ClusterRoleBinding
      kubernetes.core.k8s:
        state: absent
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: maas-admins-dashboard
      failed_when: false

  rescue:
    - ansible.builtin.fail:
        msg: |
          MaaS Resources のアンインストールに失敗しました。
          再実行: ansible-playbook playbooks/uninstall.yml -i inventory/<env> --tags workload,maas -e uninstall_maas_resources=true
