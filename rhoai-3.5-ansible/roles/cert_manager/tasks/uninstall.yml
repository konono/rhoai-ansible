---
# Uninstall: cert_manager
# Ref: https://docs.redhat.com/en/documentation/openshift_container_platform/4.18/html/security_and_compliance/cert-manager-operator-for-red-hat-openshift
# Order: CRs → Operator → namespaces
# WARNING: Deleting cert-manager resources also deletes associated TLS Secrets

- block:
    - name: Delete all cert-manager Certificate CRs
      ansible.builtin.shell: >-
        oc delete certificates,certificaterequests,issuers --all --all-namespaces --wait=false 2>/dev/null || true
      changed_when: true
      failed_when: false

    - name: Delete all ClusterIssuers
      ansible.builtin.shell: >-
        oc delete clusterissuers --all --wait=false 2>/dev/null || true
      changed_when: true
      failed_when: false

    - name: Wait for cert-manager CRs deletion
      ansible.builtin.shell: >-
        oc get certificates,certificaterequests,issuers --all-namespaces --no-headers 2>/dev/null | wc -l
      register: _cm_cr_count
      until: _cm_cr_count.stdout | trim | int == 0
      retries: 20
      delay: 10
      changed_when: false
      failed_when: false

    - name: Wait for ClusterIssuers deletion
      ansible.builtin.shell: >-
        oc get clusterissuers --no-headers 2>/dev/null | wc -l
      register: _ci_count
      until: _ci_count.stdout | trim | int == 0
      retries: 12
      delay: 10
      changed_when: false
      failed_when: false

    - name: Uninstall cert-manager Operator
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/uninstall_operator.yml"
      vars:
        operator_name: openshift-cert-manager-operator
        operator_namespace: cert-manager-operator

    - name: Delete cert-manager namespace
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: cert-manager
      failed_when: false

    - name: Wait for cert-manager namespace deletion
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: cert-manager
      register: _cm_ns
      until: _cm_ns.resources | default([]) | length == 0
      retries: 20
      delay: 10
      failed_when: false

  rescue:
    - ansible.builtin.fail:
        msg: |
          cert-manager のアンインストールに失敗しました。
          再実行: ansible-playbook playbooks/uninstall.yml -i inventory/<env> --tags deps,cert_manager -e uninstall_cert_manager=true
