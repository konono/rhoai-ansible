---
# Uninstall: gpu_operator
# Ref: https://docs.nvidia.com/datacenter/cloud-native/openshift/latest/clean-up.html
# Order: ClusterPolicy → Operator + namespace

- block:
    - name: Delete ClusterPolicy
      kubernetes.core.k8s:
        state: absent
        api_version: nvidia.com/v1
        kind: ClusterPolicy
        name: gpu-cluster-policy
      failed_when: false

    - name: Wait for ClusterPolicy deletion
      kubernetes.core.k8s_info:
        api_version: nvidia.com/v1
        kind: ClusterPolicy
        name: gpu-cluster-policy
      register: _cp
      until: _cp.resources | default([]) | length == 0
      retries: 30
      delay: 10
      failed_when: false

    - name: Uninstall GPU Operator
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/uninstall_operator.yml"
      vars:
        operator_name: gpu-operator-certified
        operator_namespace: nvidia-gpu-operator

  rescue:
    - ansible.builtin.fail:
        msg: |
          GPU Operator のアンインストールに失敗しました。
          再実行: uv run ansible-playbook playbooks/uninstall.yml -i inventory/<env> --tags deps,gpu -e uninstall_gpu_operator=true
