---
- block:
    - name: Install GPU Operator
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/install_operator.yml"
      vars:
        operator_name: gpu-operator-certified
        operator_namespace: nvidia-gpu-operator
        operator_channel: "{{ operator_channels.gpu_operator_certified }}"
        operator_target_namespaces:
          - nvidia-gpu-operator
        operator_source: "{{ catalog_sources.certified }}"

    - name: Apply GPU ClusterPolicy
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: nvidia.com/v1
          kind: ClusterPolicy
          metadata:
            name: gpu-cluster-policy
          spec:
            operator:
              defaultRuntime: crio
            daemonsets:
              tolerations:
                - key: nvidia.com/gpu
                  operator: Exists
                  effect: NoSchedule
            driver:
              enabled: true
              upgradePolicy:
                autoUpgrade: true
                maxParallelUpgrades: 1
                maxUnavailable: "25%"
            toolkit:
              enabled: true
            devicePlugin:
              enabled: true
            dcgm:
              enabled: true
            dcgmExporter:
              enabled: true
              # ServiceMonitor がないと DCGM_FI_DEV_* を誰もスクレイプせず、
              # GPU 系ダッシュボードが全パネル 0 のままになる。
              # observability role の 05-gpu-utilization.yaml にも同じ設定があるが、
              # そちらは「ClusterPolicy が未作成のとき」しか適用されない。
              # site.yml では gpu_operator が先に走って必ず CR を作るため、
              # あちらは永久に skip される。ここが唯一効く場所。
              # https://docs.nvidia.com/datacenter/cloud-native/openshift/latest/install-gpu-ocp.html#cluster-monitoring
              serviceMonitor:
                enabled: true
                interval: 15s
                honorLabels: true
            gfd:
              enabled: true
            # Set explicitly when MIG-capable workers are added. Keep existing
            # operator defaults when an inventory does not configure MIG.
            mig: "{{ {'strategy': gpu_mig_strategy} if gpu_mig_strategy is defined else omit }}"
            migManager:
              enabled: true
            nodeStatusExporter:
              enabled: true

  rescue:
    - ansible.builtin.fail:
        msg: |
          GPU Operator のインストールに失敗しました。
          再実行: uv run ansible-playbook site.yml -i inventory/<env> --tags deps,gpu
