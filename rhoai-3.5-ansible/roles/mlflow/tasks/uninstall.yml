---
# Uninstall: mlflow

- block:
    - name: Delete MLflow S3 config Secret
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: mlflow-s3-config
        namespace: redhat-ods-applications
      failed_when: false

    - name: Delete ObjectBucketClaim
      kubernetes.core.k8s:
        state: absent
        api_version: objectbucket.io/v1alpha1
        kind: ObjectBucketClaim
        name: mlflow-obc
        namespace: mlflow-workspace
      failed_when: false

    - name: Delete mlflow-workspace namespace
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: mlflow-workspace
      failed_when: false

  rescue:
    - ansible.builtin.fail:
        msg: |
          RH MLflow のアンインストールに失敗しました。
          再実行: uv run ansible-playbook playbooks/uninstall.yml -i inventory/<env> --tags workload,mlflow -e uninstall_mlflow=true
