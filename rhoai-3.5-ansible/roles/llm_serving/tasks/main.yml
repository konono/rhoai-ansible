---
# =============================================================================
# Role: llm_serving — LLM Serving (llm-d) のデプロイ
# models 変数でマルチモデルを管理。absent → present の順で処理（GPU 解放優先）
# =============================================================================

- block:

    # === モデルごとのレシピを読み込む ===
    # roles/llm_serving/vars/model_recipes.yml に hf_repo をキーとした
    # 検証済みパラメータを持つ。解決順は _fallback → レシピ → inventory。
    - name: Load per-model vLLM recipes
      ansible.builtin.include_vars:
        file: "{{ role_path }}/vars/model_recipes.yml"

    # === Proxy CR status から実効値を取得 (単独実行対応) ===
    - name: Get effective proxy settings from Proxy CR status
      ansible.builtin.command: >-
        oc get proxy cluster -o jsonpath='{.status.{{ item }}}'
      loop:
        - httpProxy
        - httpsProxy
        - noProxy
      register: _llm_proxy_status
      changed_when: false
      failed_when: false

    - name: Set proxy facts for download Jobs
      ansible.builtin.set_fact:
        _http_proxy: "{{ _http_proxy | default(_llm_proxy_status.results[0].stdout) }}"
        _https_proxy: "{{ _https_proxy | default(_llm_proxy_status.results[1].stdout) }}"
        _no_proxy: "{{ _no_proxy | default(_llm_proxy_status.results[2].stdout) }}"

    # === GPU キャパシティチェック ===
    - name: Calculate total GPU required by present models
      ansible.builtin.set_fact:
        _required_gpus: >-
          {{ models | dict2items
             | selectattr('value.state', 'defined')
             | selectattr('value.state', 'equalto', 'present')
             | map(attribute='value')
             | map(attribute='gpu_count', default=model_defaults.gpu_count)
             | map('int') | sum
             + models | dict2items
               | rejectattr('value.state', 'defined')
               | map(attribute='value')
               | map(attribute='gpu_count', default=model_defaults.gpu_count)
               | map('int') | sum }}
    
    - name: Check cluster GPU capacity
      ansible.builtin.command: >-
        oc get nodes -o jsonpath='{range .items[*]}{.status.allocatable.nvidia\.com/gpu}{"\n"}{end}'
      register: _cluster_gpus
      changed_when: false
      failed_when: false
    
    - name: Warn if GPU capacity insufficient for all present models
      ansible.builtin.fail:
        msg: >-
          GPU 不足: present モデルの合計 GPU 要求数 ({{ _required_gpus }}) が
          クラスタの GPU 数 ({{ _cluster_gpu_total }}) を超えています。
          一部のモデルの state を absent に変更するか、gpu_count を調整してください。
      vars:
        _cluster_gpu_total: "{{ _cluster_gpus.stdout_lines | default([]) | select('ne', '') | map('int') | sum }}"
      when:
        - not (download_only | default(false) | bool)
        - _cluster_gpus.rc == 0
        - (_required_gpus | int) > (_cluster_gpu_total | int)
    
    - name: Create llm-serving namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ llm_namespace }}"
    
    - name: Create hf-token Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: hf-token
            namespace: "{{ llm_namespace }}"
          type: Opaque
          data:
            HF_TOKEN: "{{ hf_token | b64encode }}"
      no_log: true
    
    - name: Check if model cache PVC exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        name: hf-model-cache
        namespace: "{{ llm_namespace }}"
      register: _model_pvc
    
    - name: Create model-cache PVC
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: hf-model-cache
            namespace: "{{ llm_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "{{ storage_class }}"
            resources:
              requests:
                storage: 200Gi
      when: _model_pvc.resources | length == 0
    
    - name: Wait for ClusterStorageContainer CRD
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/wait_for_crd.yml"
      vars:
        crd_name: clusterstoragecontainers.serving.kserve.io
    
    - name: Check existing ClusterStorageContainer
      kubernetes.core.k8s_info:
        api_version: serving.kserve.io/v1alpha1
        kind: ClusterStorageContainer
        name: default
      register: _csc_existing
    
    - name: Apply ClusterStorageContainer
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: serving.kserve.io/v1alpha1
          kind: ClusterStorageContainer
          metadata:
            name: default
            labels:
              app.kubernetes.io/managed-by: rhoai-ansible
          spec:
            container:
              name: storage-initializer
              image: "{{ llm_storage_initializer_image }}"
              env:
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-token
                      key: HF_TOKEN
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
            supportedUriFormats:
              - prefix: "pvc://"
              - prefix: "hf://"
      when: _csc_existing.resources | length == 0
    
    # chat template の ConfigMap は custom_chat_template を指定したモデルにだけ作る。
    # 以前は role 同梱の qwen3 用テンプレートを全モデルへ無条件に差し込んでいたが、
    # それは特定モデルのテンプレート不具合に対する回避策であり、既定で全モデルに
    # 適用すると本来正しいテンプレートを持つモデルまで上書きしてしまう。
    #
    # custom_chat_template / chat_template_configmap は model_recipes でも
    # 指定できるため、LLMInferenceService と同じ解決順で求める。
    - name: Resolve chat template sources per model
      ansible.builtin.set_fact:
        _chat_template_specs: >-
          {{ (_chat_template_specs | default([]))
             + [ {'name': (_cfg.chat_template_configmap | default(''))
                          if (_cfg.chat_template_configmap | default('')) | length > 0
                          else (item.key ~ '-chat-template'),
                  'src': _cfg.custom_chat_template | default('')} ] }}
      vars:
        _cfg: >-
          {{ model_defaults
             | combine(model_recipes['_fallback'], recursive=True)
             | combine(model_recipes.get(item.value.hf_repo | default(''), {}), recursive=True)
             | combine(item.value, recursive=True) }}
      loop: "{{ models | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      # absent のモデルの ConfigMap は不要（render.py も present のみ生成する）
      when:
        - (item.value.state | default(model_defaults.state)) == 'present'
        # custom_chat_template を指定したモデルだけが ConfigMap の作成対象。
        # chat_template_configmap だけ指定された場合は、利用者が自分で
        # 作成済みの ConfigMap をマウントするだけなので作らない。
        - (_cfg.custom_chat_template | default('')) | length > 0

    - name: Check that the referenced chat templates exist
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/chat_templates/{{ item.src }}.jinja"
      register: _ct_stat
      delegate_to: localhost
      loop: "{{ _chat_template_specs | default([]) | unique }}"
      loop_control:
        label: "{{ item.src }}"

    - name: Fail on an unknown chat template name
      ansible.builtin.fail:
        msg: >-
          custom_chat_template: {{ item.item.src }} に対応するファイルが
          {{ inventory_dir }}/chat_templates/{{ item.item.src }}.jinja にありません。
          inventory/sample/chat_templates/ からコピーするか、自前のものを置いてください。
          現在利用可能:
          {{ lookup('fileglob', inventory_dir ~ '/chat_templates/*.jinja', wantlist=True)
             | map('basename') | map('regex_replace', '\.jinja$', '') | join(', ') | default('(なし)', true) }}
      loop: "{{ _ct_stat.results | default([]) }}"
      loop_control:
        label: "{{ item.item.src }}"
      when: not item.stat.exists

    # lookup('file') は末尾の改行を落とすため、render.py が出力する
    # ConfigMap と内容が 1 バイトずれる。slurp + b64decode ならファイルを
    # そのまま読めるので、両経路の生成物を一致させられる。
    - name: Read the chat template files
      ansible.builtin.slurp:
        src: "{{ inventory_dir }}/chat_templates/{{ item.src }}.jinja"
      register: _chat_template_contents
      delegate_to: localhost
      loop: "{{ _chat_template_specs | default([]) | unique }}"
      loop_control:
        label: "{{ item.src }}.jinja"

    - name: Apply chat template ConfigMaps
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ item.item.name }}"
            namespace: "{{ llm_namespace }}"
          data:
            chat_template.jinja: "{{ item.content | b64decode }}"
      loop: "{{ _chat_template_contents.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }} <- {{ item.item.src }}.jinja"

    - name: Create llm-serving-sa ServiceAccount
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: llm-serving-sa
            namespace: "{{ llm_namespace }}"
    
    - name: Create RoleBinding for llm-serving-sa
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: llm-serving-sa-admin
            namespace: "{{ llm_namespace }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: admin
          subjects:
            - kind: ServiceAccount
              name: llm-serving-sa
              namespace: "{{ llm_namespace }}"
    
    - name: Delete old ClusterRoleBinding if exists
      kubernetes.core.k8s:
        state: absent
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: llm-serving-sa-admin
    
    # === Phase 1: absent モデルの削除（GPU 解放優先） ===
    - name: "Process absent models"
      ansible.builtin.include_tasks: remove_model.yml
      vars:
        _model_name: "{{ item.key }}"
        _model_cfg: >-
          {{ model_defaults
             | combine(model_recipes['_fallback'], recursive=True)
             | combine(model_recipes.get(item.value.hf_repo | default(''), {}), recursive=True)
             | combine(item.value, recursive=True) }}
      loop: "{{ models | dict2items }}"
      loop_control:
        label: "{{ item.key }} (absent)"
      when:
        - not (download_only | default(false) | bool)
        - (item.value.state | default(model_defaults.state)) == 'absent'
    
    # === Phase 2: present モデルのデプロイ ===
    - name: "Deploy present models"
      ansible.builtin.include_tasks: deploy_model.yml
      vars:
        _model_name: "{{ item.key }}"
        _model_cfg: >-
          {{ model_defaults
             | combine(model_recipes['_fallback'], recursive=True)
             | combine(model_recipes.get(item.value.hf_repo | default(''), {}), recursive=True)
             | combine(item.value, recursive=True) }}
      loop: "{{ models | dict2items }}"
      loop_control:
        label: "{{ item.key }} (present)"
      when: (item.value.state | default(model_defaults.state)) == 'present'

  rescue:
    - ansible.builtin.fail:
        msg: |
          LLM Serving のインストールに失敗しました。
          再実行: uv run ansible-playbook site.yml -i inventory/<env> --tags workload,llm
          モデルのダウンロードのみ再実行: uv run ansible-playbook site.yml -i inventory/<env> --tags llm -e download_only=true
