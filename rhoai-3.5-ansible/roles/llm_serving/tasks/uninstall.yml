---
# Uninstall: llm_serving
# No operator — resources only (managed by rhoai)
# Order: Backup → LLMInferenceService → MaaSModelRef → ClusterStorageContainer → download Jobs → Secret → PVC

- block:
    # -----------------------------------------------------------------------
    # Step 1: Backup user resources before deletion
    # -----------------------------------------------------------------------
    - name: Generate timestamp for backup directory
      ansible.builtin.command: date +%Y%m%dT%H%M%S
      register: _timestamp
      changed_when: false

    - name: Set backup directory
      ansible.builtin.set_fact:
        _backup_dir: "{{ playbook_dir }}/../.uninstall-backup/llm_serving/{{ _timestamp.stdout }}"

    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ _backup_dir }}"
        state: directory
        mode: "0750"

    - name: Get all LLMInferenceServices
      kubernetes.core.k8s_info:
        api_version: serving.kserve.io/v1alpha2
        kind: LLMInferenceService
        namespace: "{{ llm_namespace | default('llm-serving') }}"
      register: _all_lis
      failed_when: false

    - name: Backup LLMInferenceServices
      ansible.builtin.copy:
        content: "{{ item | to_nice_yaml }}"
        dest: "{{ _backup_dir }}/llminferenceservice-{{ item.metadata.name }}.yml"
        mode: "0640"
      loop: "{{ _all_lis.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: _all_lis.resources | default([]) | length > 0

    - name: Get all MaaSModelRef
      kubernetes.core.k8s_info:
        api_version: maas.opendatahub.io/v1alpha1
        kind: MaaSModelRef
        namespace: "{{ llm_namespace | default('llm-serving') }}"
      register: _all_refs
      failed_when: false

    - name: Backup MaaSModelRef resources
      ansible.builtin.copy:
        content: "{{ item | to_nice_yaml }}"
        dest: "{{ _backup_dir }}/maasmodelref-{{ item.metadata.name }}.yml"
        mode: "0640"
      loop: "{{ _all_refs.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: _all_refs.resources | default([]) | length > 0

    - name: Get ClusterStorageContainer
      kubernetes.core.k8s_info:
        api_version: serving.kserve.io/v1alpha1
        kind: ClusterStorageContainer
        name: default
      register: _csc
      failed_when: false

    - name: Backup ClusterStorageContainer
      ansible.builtin.copy:
        content: "{{ _csc.resources[0] | to_nice_yaml }}"
        dest: "{{ _backup_dir }}/clusterstoragecontainer-default.yml"
        mode: "0640"
      when: _csc.resources | default([]) | length > 0

    - name: Show backup location
      ansible.builtin.debug:
        msg: "リソースのバックアップを保存しました: {{ _backup_dir }}"

    # -----------------------------------------------------------------------
    # Step 2: Delete LLMInferenceServices
    # -----------------------------------------------------------------------
    - name: Delete LLMInferenceServices
      kubernetes.core.k8s:
        state: absent
        api_version: serving.kserve.io/v1alpha2
        kind: LLMInferenceService
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace }}"
      loop: "{{ _all_lis.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: Wait for LLMInferenceService deletion
      kubernetes.core.k8s_info:
        api_version: serving.kserve.io/v1alpha2
        kind: LLMInferenceService
        namespace: "{{ llm_namespace | default('llm-serving') }}"
      register: _lis_remaining
      until: >-
        _lis_remaining is not failed and
        (_lis_remaining.resources | default([])) | length == 0
      retries: 30
      delay: 10
      when: _all_lis.resources | default([]) | length > 0

    # -----------------------------------------------------------------------
    # Step 3: Delete MaaSModelRef resources
    # -----------------------------------------------------------------------
    - name: Delete MaaSModelRef resources
      kubernetes.core.k8s:
        state: absent
        api_version: maas.opendatahub.io/v1alpha1
        kind: MaaSModelRef
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace }}"
      loop: "{{ _all_refs.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    # -----------------------------------------------------------------------
    # Step 4: Delete remaining resources
    # -----------------------------------------------------------------------
    - name: Check if ClusterStorageContainer was created by this playbook
      kubernetes.core.k8s_info:
        api_version: serving.kserve.io/v1alpha1
        kind: ClusterStorageContainer
        name: default
      register: _csc_check
      failed_when: false

    - name: Delete ClusterStorageContainer (only if managed by rhoai-ansible)
      kubernetes.core.k8s:
        state: absent
        api_version: serving.kserve.io/v1alpha1
        kind: ClusterStorageContainer
        name: default
      when: >-
        _csc_check.resources | default([]) | length > 0 and
        (_csc_check.resources[0].metadata.labels | default({})).get('app.kubernetes.io/managed-by', '') == 'rhoai-ansible'
      failed_when: false

    # Completed Jobs must not outlive the cache: a later install would otherwise
    # trust their succeeded status even though it has created an empty PVC.
    # Fail closed on lookup/deletion errors: do not remove the cache first.
    - name: Find download Jobs in the selected LLM namespace
      kubernetes.core.k8s_info:
        api_version: batch/v1
        kind: Job
        namespace: "{{ llm_namespace | default('llm-serving') }}"
      register: _download_jobs

    - name: Delete model download Jobs before deleting their cache PVC
      kubernetes.core.k8s:
        state: absent
        api_version: batch/v1
        kind: Job
        name: "{{ item.metadata.name }}"
        namespace: "{{ llm_namespace | default('llm-serving') }}"
        delete_options:
          propagationPolicy: Foreground
        wait: true
        wait_timeout: 300
      loop: "{{ _download_jobs.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when:
        - item.metadata.name is match('^download-')
        - >-
          item.spec.template.spec.volumes | default([], true)
          | selectattr('persistentVolumeClaim', 'defined')
          | selectattr('persistentVolumeClaim.claimName', 'equalto', 'hf-model-cache')
          | list | length > 0

    - name: Delete hf-token Secret
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: hf-token
        namespace: "{{ llm_namespace | default('llm-serving') }}"
      failed_when: false

    - name: Delete model-cache PVC
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        name: hf-model-cache
        namespace: "{{ llm_namespace | default('llm-serving') }}"
      failed_when: false

  rescue:
    - ansible.builtin.fail:
        msg: |
          LLM Serving のアンインストールに失敗しました。
          バックアップ: {{ _backup_dir | default('(未作成)') }}
          再実行: uv run ansible-playbook playbooks/uninstall.yml -i inventory/<env> --tags llm -e '{"uninstall_llm_serving": true}'
