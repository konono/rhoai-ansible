---
# =============================================================================
# Reusable task: serve_model — ダウンロード済みモデルの LLMInferenceService 展開
# deploy_model.yml から download_only でない場合のみ include される
# Required vars: _model_name, _model_cfg
# =============================================================================

# Read-only check. Never scale down unrelated models to make space.
- name: Check available model GPU resources
  ansible.builtin.include_tasks: check_gpu_available.yml
  when: _existing_lis.resources | length == 0

- name: "Wait for llmisvc webhook endpoint ready ({{ _model_name }})"
  ansible.builtin.command: >-
    oc get endpoints llmisvc-webhook-server-service
    -n redhat-ods-applications
    -o jsonpath='{.subsets[0].addresses[0].ip}'
  register: _webhook_ep
  until: _webhook_ep.rc == 0 and _webhook_ep.stdout | length > 0
  retries: 24
  delay: 10
  changed_when: false
  when: not (_model_already_ready | bool)

# GPU に余裕が無い環境では LLMInferenceService を「更新」できない。
# KServe が作る Deployment は RollingUpdate(maxSurge 25% / maxUnavailable 25%) で、
# replicas=1 だと maxUnavailable が 0 に丸められるため旧 Pod を落とせない。
# 一方 GPU は 1 枚しか無いので新 Pod は Insufficient nvidia.com/gpu で Pending になり、
# 新旧どちらも Ready にならないデッドロックに陥る(実機で発生)。
# 全 GPU 数が必要数の 2 倍に満たない場合は、更新ではなく作り直す。
# 作り直しは「更新が必要なとき」だけに限る。
# GPU 数の条件だけで判定すると、GPU 1 枚の環境では何も変わっていなくても
# 毎回 LIS を削除→再作成してしまい、実行のたびにサービスが落ちる(実機で発生)。
# Pod の再起動を伴うフィールドだけを比較する。spec 全体を比較すると
# API server が補完した既定値との差分で必ず「変更あり」になってしまう。
- name: "Render the desired LLMInferenceService ({{ _model_name }})"
  ansible.builtin.set_fact:
    _desired_lis: "{{ lookup('template', 'llminferenceservice.yml.j2') | from_yaml }}"
  when: _existing_lis.resources | length > 0

- name: "Compare the desired spec with the live one ({{ _model_name }})"
  ansible.builtin.set_fact:
    _lis_spec_changed: >-
      {{ (_cur.image | default('')) != (_new.image | default(''))
         or (_cur.args | default([])) != (_new.args | default([]))
         or (_cur.env | default([])) != (_new.env | default([]))
         or (_cur.resources | default({})) != (_new.resources | default({}))
         or (_cur.volumeMounts | default([])) != (_new.volumeMounts | default([]))
         or (_cur.startupProbe | default({})) != (_new.startupProbe | default({}))
         or (_existing_lis.resources[0].spec.template.nodeSelector | default({}))
            != (_desired_lis.spec.template.nodeSelector | default({}))
         or (_existing_lis.resources[0].spec.template.volumes | default([]))
            != (_desired_lis.spec.template.volumes | default([]))
         or (_existing_lis.resources[0].spec.replicas | default(1))
            != (_desired_lis.spec.replicas | default(1))
         or (_existing_lis.resources[0].spec.model.uri | default(''))
            != (_desired_lis.spec.model.uri | default('')) }}
  vars:
    _cur: >-
      {{ (_existing_lis.resources[0].spec.template.containers | default([]))
         | selectattr('name', 'equalto', 'main') | list | first | default({}) }}
    _new: >-
      {{ (_desired_lis.spec.template.containers | default([]))
         | selectattr('name', 'equalto', 'main') | list | first | default({}) }}
  when: _existing_lis.resources | length > 0

# GPU に余裕が無い環境では LLMInferenceService を「更新」できない。
# KServe が作る Deployment は RollingUpdate(maxSurge 25% / maxUnavailable 25%) で、
# replicas=1 だと maxUnavailable が 0 に丸められるため旧 Pod を落とせない。
# 一方 GPU は 1 枚しか無いので新 Pod は Insufficient nvidia.com/gpu で Pending になり、
# 新旧どちらも Ready にならないデッドロックに陥る(実機で発生)。
# 全 GPU 数が必要数の 2 倍に満たない場合は、更新ではなく作り直す。
#
# 変更が無ければ問い合わせ自体が不要なので、比較の後に実行する。
- name: Read selected nodes for rollout strategy
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    label_selectors: "{{ _gpu_node_selectors }}"
  vars:
    _gpu_node_selectors: >-
      {%- set selectors = [] -%}
      {%- for key, value in (_model_cfg.node_selector | default({})).items() -%}
      {%- set _ = selectors.append(key ~ '=' ~ value) -%}
      {%- endfor -%}
      {{ selectors }}
  register: _rollout_nodes
  when:
    - _existing_lis.resources | length > 0
    - _lis_spec_changed | default(false) | bool

- name: Count selected GPU resources for rollout
  ansible.builtin.set_fact:
    _rollout_gpu_total: >-
      {%- set total = namespace(value=0) -%}
      {%- for node in _rollout_nodes.resources -%}
      {%- if not (node.spec.unschedulable | default(false)) -%}
      {%- set total.value = total.value + (node.status.allocatable.get(_model_cfg.gpu_resource | default('nvidia.com/gpu'), 0) | int) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ total.value }}
  when:
    - _existing_lis.resources | length > 0
    - _lis_spec_changed | default(false) | bool

# GPU 数が取れないまま先に進むと、合計 0 として「作り直し」と判定され、
# 稼働中のモデルを削除してしまう。削除は不可逆なので、判定材料が無い場合は
# 削除せずにここで止める(fail closed)。
- name: "Fail when the cluster GPU count cannot be determined ({{ _model_name }})"
  ansible.builtin.fail:
    msg: >-
      クラスタの GPU 数を取得できませんでした。この値が無いと
      「ローリング更新で足りるか / 作り直しが必要か」を判定できず、
      稼働中の {{ _model_name }} を誤って削除する恐れがあるため停止します。
      次が通るか確認してください:
      oc get nodes -o yaml (resource={{ _model_cfg.gpu_resource | default('nvidia.com/gpu') }})
  when:
    - _existing_lis.resources | length > 0
    - _lis_spec_changed | default(false) | bool
    - (_rollout_gpu_total | default(0) | int) <= 0

# Resource / selector key removal cannot be expressed by omitting keys in a merge patch.
# Recreate on those changes so stale GPU requests and node labels cannot survive.
- name: "Decide whether an in-place update can roll ({{ _model_name }})"
  ansible.builtin.set_fact:
    _needs_recreate: >-
      {{ _existing_lis.resources | length > 0
         and (_lis_spec_changed | default(false) | bool)
         and (
           ((_rollout_gpu_total | default(0) | int) < ((_model_cfg.gpu_count | int) * (_model_cfg.replicas | default(1) | int) * 2))
           or ((_existing_lis.resources[0].spec.template.nodeSelector | default({}))
               != (_desired_lis.spec.template.nodeSelector | default({})))
           or ((_current_gpu_keys | sort) != [_model_cfg.gpu_resource | default('nvidia.com/gpu')])
         ) }}
  vars:
    _current_gpu_keys: >-
      {{ ((_existing_lis.resources[0].spec.template.containers | selectattr('name', 'equalto', 'main') | first).resources.requests
          | default({}) | list | select('match', '^nvidia[.]com/(gpu|mig-.*)$') | list)
         if _existing_lis.resources | length > 0 else [] }}

- name: "Report the update strategy ({{ _model_name }})"
  ansible.builtin.debug:
    msg: >-
      {{ '変更なし。LLMInferenceService はそのまま'
         if _existing_lis.resources | length > 0
            and not (_lis_spec_changed | default(false) | bool)
         else ('GPU 容量不足または GPU 種別・配置先の変更のため削除してから再作成する'
               if _needs_recreate | bool
               else 'そのまま適用する(新規作成、またはローリング更新が可能)') }}

- name: "Delete LLMInferenceService before re-creating ({{ _model_name }})"
  kubernetes.core.k8s:
    state: absent
    api_version: serving.kserve.io/v1alpha2
    kind: LLMInferenceService
    name: "{{ _model_name }}"
    namespace: "{{ _model_cfg.namespace }}"
  when: _needs_recreate | bool

- name: "Wait for GPU release before re-creating ({{ _model_name }})"
  ansible.builtin.command: >-
    oc get pods -n {{ _model_cfg.namespace }}
    -l app.kubernetes.io/name={{ _model_name }}
    --no-headers --ignore-not-found
  register: _recreate_pods
  until: _recreate_pods.rc == 0 and _recreate_pods.stdout_lines | length == 0
  retries: 60
  delay: 5
  changed_when: false
  failed_when: _recreate_pods.rc != 0 or _recreate_pods.stdout_lines | length > 0
  when: _needs_recreate | bool

- name: "Apply LLMInferenceService for {{ _model_name }}"
  kubernetes.core.k8s:
    state: present
    template: llminferenceservice.yml.j2

- name: "Apply MaaSModelRef for {{ _model_name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: maas.opendatahub.io/v1alpha1
      kind: MaaSModelRef
      metadata:
        name: "{{ _model_name }}"
        namespace: "{{ _model_cfg.namespace }}"
      spec:
        modelRef:
          kind: LLMInferenceService
          name: "{{ _model_name }}"
        tenantRef: models-as-a-service

- name: "Wait for LLMInferenceService Ready ({{ _model_name }})"
  kubernetes.core.k8s_info:
    api_version: serving.kserve.io/v1alpha2
    kind: LLMInferenceService
    name: "{{ _model_name }}"
    namespace: "{{ _model_cfg.namespace }}"
  register: _lis_status
  until: >-
    _lis_status is not failed and
    (_lis_status.resources | default([])) | length > 0 and
    ((_lis_status.resources[0].status | default({})).conditions | default([])
     | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True')
     | list | length > 0)
  retries: 120
  delay: 10

# MaaSModelRef が Ready になるには MaaSAuthPolicy / MaaSSubscription が
# 先に適用されている必要がある。それらは keycloak の manage_maas_access が作るため、
# ここでブロックして待つと「ポリシー未適用 → Ready にならない → 待ち続ける」で
# デッドロックする（playbooks/llm_add_model.yml の順序が該当）。
# ここでは状態を見るだけにして、実際の待機は wait_modelref.yml に分離した。
- name: "Check MaaSModelRef phase ({{ _model_name }})"
  kubernetes.core.k8s_info:
    api_version: maas.opendatahub.io/v1alpha1
    kind: MaaSModelRef
    name: "{{ _model_name }}"
    namespace: "{{ _model_cfg.namespace }}"
  register: _modelref_status
  changed_when: false

- name: "Report MaaSModelRef phase ({{ _model_name }})"
  ansible.builtin.debug:
    msg: >-
      MaaSModelRef {{ _model_name }}:
      phase={{ (_modelref_status.resources | default([{}]))[0].status.phase | default('(未設定)') }}
      {{ '— Pending の場合は MaaS ポリシー適用後に Ready になる'
         if ((_modelref_status.resources | default([{}]))[0].status.phase | default('')) != 'Ready'
         else '' }}
