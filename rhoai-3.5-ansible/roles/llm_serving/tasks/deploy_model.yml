---
# =============================================================================
# Reusable task: deploy_model — モデルダウンロード + InferenceService デプロイ
# Required vars: _model_name, _model_cfg (model_defaults | combine(item.value, recursive=True))
# =============================================================================

- name: "Check if LLMInferenceService already exists ({{ _model_name }})"
  kubernetes.core.k8s_info:
    api_version: serving.kserve.io/v1alpha2
    kind: LLMInferenceService
    name: "{{ _model_name }}"
    namespace: "{{ _model_cfg.namespace }}"
  register: _existing_lis

- name: "Check if model already ready ({{ _model_name }})"
  ansible.builtin.set_fact:
    _model_already_ready: >-
      {{ _existing_lis.resources | length > 0 and
         (_existing_lis.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Ready')
          | selectattr('status', 'equalto', 'True')
          | list | length > 0) }}

- name: "Check if download Job already completed ({{ _model_name }})"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: "download-{{ _model_name }}"
    namespace: "{{ _model_cfg.namespace }}"
  register: _existing_job
  when: not (_model_already_ready | bool)

- name: "Check if download Job is currently running ({{ _model_name }})"
  ansible.builtin.set_fact:
    _job_running: >-
      {{ _existing_job.resources | default([]) | length > 0 and
         (_existing_job.resources[0].status.active | default(0)) > 0 }}
  when: not (_model_already_ready | bool)

- name: "Determine if download is needed ({{ _model_name }})"
  ansible.builtin.set_fact:
    _download_needed: >-
      {{ not (_model_already_ready | bool) and
         not (_job_running | default(false) | bool) and
         (_existing_job.resources | default([]) | length == 0 or
          (_existing_job.resources[0].status.succeeded | default(0)) == 0) }}

- name: "Check if model data exists on PVC ({{ _model_name }})"
  ansible.builtin.shell: |
    oc run pvc-check-{{ _model_name }} --rm -i --restart=Never \
      -n {{ _model_cfg.namespace }} \
      --image=registry.access.redhat.com/ubi9/ubi-minimal:latest \
      --overrides='{
        "spec": {
          "containers": [{
            "name": "check",
            "image": "registry.access.redhat.com/ubi9/ubi-minimal:latest",
            "command": ["test", "-f", "/models/{{ _model_name }}/config.json"],
            "volumeMounts": [{"name": "cache", "mountPath": "/models"}]
          }],
          "volumes": [{"name": "cache", "persistentVolumeClaim": {"claimName": "hf-model-cache"}}]
        }
      }' 2>/dev/null
  register: _pvc_check
  changed_when: false
  failed_when: false
  when: _download_needed | bool

- name: "Skip download — model data already on PVC ({{ _model_name }})"
  ansible.builtin.set_fact:
    _download_needed: false
  when: _download_needed | bool and _pvc_check.rc | default(1) == 0

- name: "Delete failed download Job ({{ _model_name }})"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: "download-{{ _model_name }}"
    namespace: "{{ _model_cfg.namespace }}"
  when: >-
    _download_needed | bool and
    _existing_job.resources | default([]) | length > 0 and
    (_existing_job.resources[0].status.succeeded | default(0)) == 0

- name: "Create download Job for {{ _model_name }}"
  kubernetes.core.k8s:
    state: present
    template: download-job.yml.j2
  when: _download_needed | bool

- name: "Wait for running download Job completion ({{ _model_name }})"
  ansible.builtin.command: >-
    oc wait --for=condition=complete
    job/download-{{ _model_name }}
    -n {{ _model_cfg.namespace }} --timeout=3600s
  changed_when: false
  when: _job_running | default(false) | bool

- name: "Wait for download Job completion ({{ _model_name }})"
  ansible.builtin.command: >-
    oc wait --for=condition=complete
    job/download-{{ _model_name }}
    -n {{ _model_cfg.namespace }} --timeout=3600s
  changed_when: false
  when: _download_needed | bool

- name: "Skip serving — download_only mode ({{ _model_name }})"
  ansible.builtin.debug:
    msg: >-
      download_only=true のためモデルデータのダウンロードのみ実行しました
      ({{ _model_name }})。配信するには download_only なしで再実行してください。
  when: download_only | default(false) | bool

- name: "Deploy LLMInferenceService ({{ _model_name }})"
  ansible.builtin.include_tasks: serve_model.yml
  when: not (download_only | default(false) | bool)
