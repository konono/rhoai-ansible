---
llm_namespace: llm-serving

# true なら PVC へのモデルダウンロードだけ行い、LLMInferenceService は作らない。
# GPU 容量チェックと absent モデルの削除もスキップする。
#   uv run ansible-playbook site.yml -i inventory/<env> --tags llm -e download_only=true
#   uv run ansible-playbook playbooks/llm_download.yml -i inventory/<env>
download_only: false

# model_defaults は models.<name> の各エントリで再帰的に上書きされる。
#
# vLLM の引数は `vllm_args` に生の文字列で書く。vLLM のバージョンアップで
# フラグが増減しても role 側の変更は不要（Ansible 側に名前付きキーを増やさない方針）。
# role が自動付与するのは --chat-template のみ（custom_chat_template 指定時）。
# --served-model-name は KServe/llm-d の起動スクリプトが付与するため付けない。
model_defaults:
  namespace: llm-serving
  state: present
  vllm_image: vllm/vllm-openai:v0.28.0
  # --- chat template ---
  # 既定はモデル同梱の chat template をそのまま使う（--chat-template を付けない）。
  # もともと role 同梱の qwen3 用テンプレートを常に差し込んでいたが、これは
  # 特定モデルのテンプレート不具合を回避するための対処だった。全モデルに
  # 適用すると、本来正しいテンプレートを持つモデルまで上書きしてしまう。
  #
  # custom_chat_template: 差し込む chat template の名前。
  #   実体は inventory 配下の chat_templates/<名前>.jinja に置く。
  #   例) custom_chat_template: qwen3
  #       -> inventory/<env>/chat_templates/qwen3.jinja
  #   どのモデルにどれを当てるかは model_recipes.yml 側の知識として持ち、
  #   ファイルの実体は環境ごとに差し替えられるよう inventory に置く。
  # chat_template_configmap: 作成する ConfigMap 名の上書き
  #   (既定は <model>-chat-template)。custom_chat_template なしで
  #   これだけ指定した場合は、利用者が別途作成済みの ConfigMap をマウントする。
  custom_chat_template: ""
  chat_template_configmap: ""
  replicas: 1

  # --- vLLM 引数 ---
  # vLLM のパラメータはモデルのアーキテクチャ・量子化方式・ハードウェアで変わるため、
  # 全モデル共通の既定値は持たない。検証済みのレシピを hf_repo をキーに
  # roles/llm_serving/vars/model_recipes.yml へ蓄積している。
  # inventory の models.<key>.vllm_args を書けばレシピを完全に上書きできる。
  # （ここでは定義しない。未定義のまま model_recipes から解決される）

  # --- コンテナ環境変数の追加 (VLLM_* / NCCL_* など) ---
  vllm_env: {}

  # --- Pod リソース (nvidia.com/gpu は gpu_count から設定) ---
  gpu_count: 1
  resources:
    requests:
      cpu: "500m"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi

  # --- /dev/shm サイズ。空なら emptyDir を追加しない (tensor parallel で必要) ---
  shm_size: ""

  # --- 起動待ち (failureThreshold * periodSeconds 秒まで待つ) ---
  startup_probe_failure_threshold: 120
  startup_probe_period_seconds: 10

  purge: false
