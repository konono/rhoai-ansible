[defaults]
inventory = inventory/sample/hosts.yml
roles_path = roles
collections_paths = collections
callbacks_enabled = ansible.builtin.default
result_format = yaml
retry_files_enabled = false
timeout = 60

# -i にディレクトリを渡すと Ansible は配下のファイルを全て inventory ソース
# として読もうとする。inventory/<env>/chat_templates/*.jinja は
# custom_chat_template 用の資材であって inventory ではないため除外する。
# (除外しないと実行のたびに "Unable to parse ... as an inventory source" が出る)
inventory_ignore_extensions = .jinja, .j2, .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt
inventory_ignore_patterns = chat_templates

[privilege_escalation]
become = false
