---
# Offline: regenerate a draft from a customer-provided baseline, without API access.
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_root: "{{ playbook_dir | dirname }}"
    migration_root: "{{ playbook_dir }}"
  tasks:
    - ansible.builtin.assert:
        that:
          - migration_snapshot_file is defined
          - migration_output_dir is match('^/')
          - migration_kubeconfig is defined
    - ansible.builtin.stat:
        path: "{{ migration_output_dir }}"
      register: output
    - ansible.builtin.assert:
        that: not output.stat.exists
    - ansible.builtin.set_fact:
        _migration_snapshot: "{{ lookup('file', migration_snapshot_file) | from_yaml }}"
      no_log: true
    - ansible.builtin.file:
        path: "{{ migration_output_dir }}/{{ item }}"
        state: directory
        mode: '0700'
      loop: ['', inventory, inventory/group_vars, inventory/group_vars/all]
    - ansible.builtin.copy:
        src: "{{ migration_snapshot_file }}"
        dest: "{{ migration_output_dir }}/baseline.yml"
        mode: '0600'
    - ansible.builtin.include_role:
        name: migration
        tasks_from: generate
