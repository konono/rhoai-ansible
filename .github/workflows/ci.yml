name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # playbook のルート（repo 直下のディレクトリ名）
  PB_DIR: rhoai-3.5-ansible
  ANSIBLE_COLLECTIONS_PATH: ~/.ansible/collections

jobs:
  test:
    name: Tests / Syntax / Manifest parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # playbook の pyproject.toml と合わせる
          pip install "ansible-core>=2.17,<3.0" "kubernetes>=29.0" "jmespath>=1.0" \
                      pyyaml jinja2
          ansible-galaxy collection install kubernetes.core community.general

      # ---- ユニットテスト -------------------------------------------------
      # tests/ は top-level import なので playbook ルートから実行する。
      # discover は使えない（tests/ に __init__.py が無い）ため列挙する。
      - name: Unit tests
        working-directory: ${{ env.PB_DIR }}
        env:
          GPU_RUNTIME_TEST_LOG_DIR: ${{ github.workspace }}/${{ env.PB_DIR }}/.local/render-gpu-repeat/initial/cases
        run: |
          fail=0
          for t in tests/test_*.py; do
            mod="tests.$(basename "$t" .py)"
            echo "::group::$mod"
            python -m unittest "$mod" -v || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Repeat generated GPU runtime tests with diagnostics
        if: success() || failure()
        working-directory: ${{ env.PB_DIR }}
        run: |
          set -o pipefail
          jq --version
          fail=0
          for attempt in 1 2 3; do
            logdir="$PWD/.local/render-gpu-repeat/run-$attempt"
            mkdir -p "$logdir"
            GPU_RUNTIME_TEST_LOG_DIR="$logdir/cases" \
              python -m unittest tests.test_render_gpu_runtime -v 2>&1 | tee "$logdir/unittest.log" || fail=1
          done
          exit "$fail"

      - name: Preserve GPU runtime test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-gpu-runtime-diagnostics
          path: ${{ env.PB_DIR }}/.local/render-gpu-repeat/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # ---- Ansible 構文チェック -------------------------------------------
      # CI では inventory/sample だけが git 管理対象（他環境は .gitignore）。
      - name: Ansible syntax check
        working-directory: ${{ env.PB_DIR }}
        run: |
          fail=0
          for pb in site.yml playbooks/*.yml; do
            echo "::group::$pb"
            ansible-playbook --syntax-check -i inventory/sample "$pb" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      # ---- manifest レンダリング ------------------------------------------
      # render.py は Ansible role のロジックを Python で再実装したもの。
      # 生成が通ること自体に加え、tests/test_render_parity.py が
      # Ansible テンプレートとの出力一致を検証している。
      - name: Render manifests (sample)
        working-directory: ${{ env.PB_DIR }}
        run: |
          python render-manifests/render.py -c inventory/sample -o /tmp/render-out
          test -d /tmp/render-out/manifests || { echo "manifests が生成されていません"; exit 1; }
          test -f /tmp/render-out/manual-deploy-guide.md || { echo "手順書が生成されていません"; exit 1; }
          echo "生成されたディレクトリ:"
          ls /tmp/render-out/manifests

      - name: Check generated secrets are not world-readable
        run: |
          for f in /tmp/render-out/generated-passwords.yml; do
            [ -e "$f" ] || continue
            mode=$(stat -c '%a' "$f")
            [ "$mode" = "600" ] || { echo "$f のパーミッションが $mode です (600 であるべき)"; exit 1; }
          done

      # ---- シェルスクリプト ------------------------------------------------
      - name: Shell script syntax
        working-directory: ${{ env.PB_DIR }}
        run: |
          fail=0
          for s in scripts/*.sh; do
            echo "checking $s"
            bash -n "$s" || fail=1
          done
          exit $fail

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ${{ env.PB_DIR }}/scripts
          severity: error

  secrets-guard:
    name: Secrets must not be committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 環境固有ファイルが誤ってコミットされていないことを確認する。
      # .gitignore で除外しているが、強制追加されると気づけないため CI でも見る。
      - name: No environment-specific files in git
        run: |
          fail=0
          while read -r pattern; do
            hits=$(git ls-files "$pattern" || true)
            if [ -n "$hits" ]; then
              echo "::error::コミットしてはいけないファイルがあります ($pattern):"
              echo "$hits"
              fail=1
            fi
          done <<'EOF'
          **/.generated-passwords.yml
          **/generated-passwords.yml
          **/.credentials/**
          **/.kube/**
          **/.vllm-token
          **/.vllm-token.meta
          **/opencode.json
          **/vault.yml
          **/.maas-policies-generated.yaml
          EOF
          exit $fail

      # inventory/sample の固有情報チェックは
      # tests/test_sample_sanitized.py が担当する（test ジョブで実行済み）。
