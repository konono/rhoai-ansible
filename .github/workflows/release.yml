name: Release playbook

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install 'ansible-core>=2.17,<3.0' 'kubernetes>=29.0' 'jmespath>=1.0' PyYAML Jinja2
          ansible-galaxy collection install kubernetes.core community.general

      - name: Run tests and syntax checks
        working-directory: rhoai-3.5-ansible
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          ansible-playbook --syntax-check -i inventory/sample site.yml
          for playbook in playbooks/*.yml; do
            ansible-playbook --syntax-check -i inventory/sample "$playbook"
          done
          for script in scripts/*.sh; do bash -n "$script"; done

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version and updater tests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(cat rhoai-3.5-ansible/VERSION)"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 -c 'import os, pathlib, tomllib; assert tomllib.loads(pathlib.Path("rhoai-3.5-ansible/pyproject.toml").read_text())["project"]["version"] == os.environ["TAG"].removeprefix("v")'
          python3 -m unittest discover -s rhoai-3.5-ansible/tests -p 'test_self_update.py' -v
          python3 -m py_compile rhoai-3.5-ansible/scripts/self-update.py

      - name: Build source archive from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/stage
          git archive "$TAG" rhoai-3.5-ansible | tar -xf - -C dist/stage
          cd dist/stage/rhoai-3.5-ansible
          find . -type f ! -name '.release-files.txt' -print | sed 's#^./##' | sort > .release-files.txt
          cd ..
          tar -czf ../rhoai-3.5-ansible.tar.gz rhoai-3.5-ansible
          cd ..
          sha256sum rhoai-3.5-ansible.tar.gz > checksums.txt
          python3 ../rhoai-3.5-ansible/scripts/self-update.py \
            --archive rhoai-3.5-ansible.tar.gz --checksums checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/rhoai-3.5-ansible.tar.gz dist/checksums.txt --verify-tag --generate-notes
